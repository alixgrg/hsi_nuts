name: hsi-nuts
channels:
  - conda-forge
dependencies:
  # Tested against the local hsi-nuts environment on 2026-07-06.
  # Keep Python pinned for result reproducibility.
  - python=3.14.6
  - pip

  # Core numerical stack
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.18.0
  - scikit-image=0.26.0
  - scikit-learn=1.9.0

  # Data formats used by the project
  - h5py=3.16.0
  - pyarrow=24.0.0
  - openpyxl=3.1.5

  # Modelling / optimisation
  - optuna=4.9.0

  # Visualisation and notebooks
  - plotly=6.7.0
  - matplotlib=3.11.0
  - ipython=9.14.1
  - ipykernel=7.3.0
  - jupyterlab=4.6.0
  - notebook=7.6.0
  - nbformat=5.10.4
  - ipywidgets=8.1.8
